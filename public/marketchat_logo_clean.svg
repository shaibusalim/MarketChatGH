<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <!-- Chat bubble -->
  <rect x="20" y="20" rx="40" ry="40" width="260" height="120" fill="none" stroke="#2563eb" stroke-width="10"/>
  <polygon points="60,140 100,140 70,170" fill="#2563eb"/>

  <!-- Bar chart -->
  <rect x="80" y="90" width="20" height="40" fill="#3b82f6"/>
  <rect x="120" y="70" width="20" height="60" fill="#06b6d4"/>
  <rect x="160" y="50" width="20" height="80" fill="#22c55e"/>
  <rect x="200" y="30" width="20" height="100" fill="#f59e0b"/>

  <!-- Growth arrow -->
  <polyline points="80,100 140,70 200,40 240,20" fill="none" stroke="#16a34a" stroke-width="6"/>
  <polygon points="240,20 230,25 245,35" fill="#16a34a"/>

  <!-- Text -->
  <text x="300" y="95" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1e3a8a">
    Market<tspan fill="#16a34a">Chat</tspan>
  </text>
</svg>
